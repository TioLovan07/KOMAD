<!DOCTYPE html>
<html lang="id">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <title>
   Halaman draft Word
  </title>
  <script defer="" src="vendor/jszip.min.js">
  </script>
  <script defer="" src="vendor/docx-preview.js">
  </script>
  <script defer="" src="viewer.js">
  </script>
  <style>
   html,
body {
    margin: 0;
    padding: 0;
    background: #e4e9ee;
    color: #183638;
    font-family: 'Segoe UI', Arial, sans-serif
}

/* The parent document-host owns scrolling; prevent nested scrollbars. */
html { overflow: hidden; }

#pages {
    min-height: 400px;
    overflow: visible
}

#pages>.worddoc-wrapper {
    background: transparent;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: max-content
}

#pages section.worddoc {
    flex-shrink: 0;
    box-shadow: 0 2px 10px #18363818;
    margin-bottom: 22px
}

#pages section.worddoc:last-child {
    margin-bottom: 0
}

#pages .draft-highlight {
    background: #fff0b5;
    color: #b64016;
    border-radius: 3px;
    font-weight: 400
}

#pages .draft-highlight:hover {
    background: #ffdf7b
}

#empty {
    margin: 0;
    padding: 36px;
    text-align: center;
    font-size: 14px
}

#pages [data-page-label]::after {
    content: attr(data-page-label);
    position: absolute;
    right: 12px;
    bottom: 6px;
    font: 10px 'Segoe UI', sans-serif;
    color: #718577
}

#pages section.worddoc {
    position: relative
}

#pages section.worddoc {
    font-family: "Bookman Old Style", "Times New Roman", serif !important;
    font-size: 12pt
}

#pages section.worddoc article p {
    font-family: "Bookman Old Style", "Times New Roman", serif !important;
    font-size: 12pt;
    text-justify: inter-word;

    overflow-wrap: normal
}

#pages section.worddoc article span {
    font-family: inherit !important;
    font-size: inherit;
    overflow-wrap: normal !important;
    word-break: normal !important;
    hyphens: none !important
}

#pages img {
    max-width: 100%
}

#note-popup {
    position: fixed;
    z-index: 10000;
    padding: 12px 15px;
    background: #092e53;
    color: #fff;
    border-radius: 7px;
    font: 15px/1.5 Arial, sans-serif;
    box-shadow: 0 3px 12px #0003;
    max-height: 40vh;
    overflow: auto;
    overflow-wrap: anywhere
}

#pages .draft-highlight {
    cursor: help
}

#pages .draft-highlight:focus {
    outline: 2px solid #b77b16;
    outline-offset: 3px
}
  </style>
 </head>
 <body>
  <p id="empty">
   Menyiapkan halaman draft…
  </p>
  <div id="styles">
  </div>
  <div id="pages">
  </div>
 </body>
</html>
